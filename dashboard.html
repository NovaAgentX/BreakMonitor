<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Clock — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dash-shell">

    <div class="dash-topbar">
      <div class="dash-brand"><span class="brand-dot"></span> TEAMCLOCK</div>
      <div class="dash-user-chip">
        <div class="dash-user-meta" style="text-align:right;">
          <span class="dash-user-name" id="topUserName">&nbsp;</span>
          <span class="dash-user-role" id="topUserRole">&nbsp;</span>
        </div>
        <div class="dash-avatar" id="topUserAvatar">?</div>
        <button class="btn-logout-icon" id="changePasswordBtn" title="Change password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
        <button class="btn-logout-icon" id="logoutBtn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <div class="dash-main">
      <div class="dash-grid">

        <!-- LEFT: Punch Clock -->
        <div class="punch-card">
          <div class="punch-clock-time" id="liveClockTime">--:--:--</div>
          <div class="punch-clock-date" id="liveClockDate">&nbsp;</div>

          <div id="statusPillWrap">
            <span class="punch-status-pill status-offline"><span class="dot"></span> Loading&hellip;</span>
          </div>

          <button class="punch-btn-main btn-clockin" id="clockBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            <span id="clockBtnLabel">Loading&hellip;</span>
          </button>

          <div id="activeBreakBannerWrap"></div>

          <div class="break-section">
            <div class="break-section-label">Log a Break</div>
            <div class="break-grid" id="breakButtonsGrid">
              <!-- rendered by JS -->
            </div>
          </div>
        </div>

        <!-- RIGHT: Team Status + History -->
        <div>
          <!-- Visible to Team Lead only -->
          <div class="panel-card" id="teamLeadPanel" style="display:none;">
            <div class="panel-title">Add Employee</div>
            <form id="addEmployeeForm">
              <div class="field-group">
                <label class="field-label" for="newEmpFullName">Full Name</label>
                <input type="text" id="newEmpFullName" class="field-input" placeholder="e.g. Sara Khan" required>
              </div>
              <div class="field-group">
                <label class="field-label" for="newEmpUsername">Username</label>
                <input type="text" id="newEmpUsername" class="field-input" placeholder="letters, numbers, dots, underscores" required>
              </div>
              <div class="field-group">
                <label class="field-label" for="newEmpRole">Role</label>
                <select id="newEmpRole" class="field-select" required>
                  <option value="">Select role&hellip;</option>
                </select>
              </div>
              <div class="field-group">
                <label class="field-label" for="newEmpPassword">Temporary Password</label>
                <input type="text" id="newEmpPassword" class="field-input" placeholder="At least 6 characters" required>
              </div>
              <div class="field-error" id="addEmployeeError"></div>
              <button type="submit" class="btn-machine" id="addEmployeeSubmitBtn">Add Employee</button>
            </form>
          </div>

          <div class="panel-card" id="teamStatusPanel" style="display:none;">
            <div class="panel-title"><span class="live-dot"></span> Who's Online</div>
            <div class="team-list" id="teamListWrap">
              <div class="empty-note">Loading team status&hellip;</div>
            </div>
          </div>

          <div class="panel-card">
            <div class="panel-title">My History</div>
            <div class="history-tabs">
              <button class="history-tab-btn active" data-tab="attendance" id="histTabAttendance">Login/Logout</button>
              <button class="history-tab-btn" data-tab="breaks" id="histTabBreaks">Breaks</button>
            </div>

            <div id="historyAttendanceWrap">
              <table class="history-table">
                <thead>
                  <tr><th>Date</th><th>Login</th><th>Logout</th><th>Status</th></tr>
                </thead>
                <tbody id="attendanceHistoryTbody">
                  <tr><td colspan="4" class="empty-note">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>

            <div id="historyBreaksWrap" style="display:none;">
              <table class="history-table">
                <thead>
                  <tr><th>Break</th><th>Date</th><th>Start</th><th>End</th><th>Duration</th></tr>
                </thead>
                <tbody id="breaksHistoryTbody">
                  <tr><td colspan="5" class="empty-note">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div class="toast-msg" id="toastMsg"><span class="toast-dot"></span><span id="toastText"></span></div>

  <script src="script.js"></script>
</body>
</html>
