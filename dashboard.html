<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Clock — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dash-shell">

    <div class="dash-topbar">
      <div class="dash-brand"><span class="brand-dot"></span> TEAMCLOCK</div>
      <div class="dash-user-chip">
        <div class="dash-user-meta" style="text-align:right;">
          <span class="dash-user-name" id="topUserName">&nbsp;</span>
          <span class="dash-user-role" id="topUserRole">&nbsp;</span>
        </div>
        <div class="dash-avatar" id="topUserAvatar">?</div>
        <button class="btn-logout-icon" id="logoutBtn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <div class="dash-main">
      <div class="dash-grid">

        <!-- LEFT: Punch Clock -->
        <div class="punch-card">
          <div class="punch-clock-time" id="liveClockTime">--:--:--</div>
          <div class="punch-clock-date" id="liveClockDate">&nbsp;</div>

          <div id="statusPillWrap">
            <span class="punch-status-pill status-offline"><span class="dot"></span> Loading&hellip;</span>
          </div>

          <button class="punch-btn-main btn-clockin" id="clockBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span id="clockBtnLabel">Loading&hellip;</span>
          </button>

          <div id="activeBreakBannerWrap"></div>

          <div class="break-section">
            <div class="break-section-label">Log a Break</div>
            <div class="break-grid" id="breakButtonsGrid">
              <!-- rendered by JS -->
            </div>
          </div>
        </div>

        <!-- RIGHT: Team Status + History -->
        <div>
          <div class="panel-card">
            <div class="panel-title"><span class="live-dot"></span> Who's Online</div>
            <div class="team-list" id="teamListWrap">
              <div class="empty-note">Loading team status&hellip;</div>
            </div>
          </div>

          <div class="panel-card">
            <div class="panel-title">My History</div>
            <div class="history-tabs">
              <button class="history-tab-btn active" data-tab="attendance" id="histTabAttendance">Clock In/Out</button>
              <button class="history-tab-btn" data-tab="breaks" id="histTabBreaks">Breaks</button>
            </div>

            <div id="historyAttendanceWrap">
              <table class="history-table">
                <thead>
                  <tr><th>Date</th><th>Login</th><th>Logout</th><th>Status</th></tr>
                </thead>
                <tbody id="attendanceHistoryTbody">
                  <tr><td colspan="4" class="empty-note">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>

            <div id="historyBreaksWrap" style="display:none;">
              <table class="history-table">
                <thead>
                  <tr><th>Break</th><th>Date</th><th>Start</th><th>End</th><th>Duration</th></tr>
                </thead>
                <tbody id="breaksHistoryTbody">
                  <tr><td colspan="5" class="empty-note">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div class="toast-msg" id="toastMsg"><span class="toast-dot"></span><span id="toastText"></span></div>

  <script src="script.js"></script>
</body>
</html>
